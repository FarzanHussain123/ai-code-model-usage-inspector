name: AI Governance Scan

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ai-governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install AI Governance Scanner
        run: |
          pip install -r requirements.txt

      - name: Run AI Governance Scan
        run: |
          zip -r source.zip .
          python scan_zip.py source.zip

      - name: Upload AI Governance Reports
        uses: actions/upload-artifact@v4
        with:
          name: ai-governance-reports
          path: |
            ai_governance_report.xlsx
            ai_governance_report.pdf
