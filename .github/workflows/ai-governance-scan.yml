name: AI Governance Scan

on:
  push:
  pull_request:

jobs:
  ai-governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Governance Scanner
        run: |
          python test_model_detection.py

      - name: Upload Governance Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-governance-reports
          path: |
            ai_governance_report.xlsx
            ai_governance_report.pdf
